name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python 语法与离线自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 编译全部 Python 文件（语法检查）
        run: python -m compileall -q backend agents mcp_servers services scripts
      - name: 安全反例演示（离线 SQLite：旧拼接模式被注入 vs 白名单+参数绑定安全）
        run: python scripts/security/legacy_free_sql_demo.py

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
